# RPLiDAR driver
rplidar_driver = { git = "https://github.com/dmweis/rplidar_driver.git" }
# Devices are opened by their configured path; USB port enumeration is unused.
# Match the driver's feature set and avoid a libudev link dependency.
serialport = { version = "4.2", default-features = false }
