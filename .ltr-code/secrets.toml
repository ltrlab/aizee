# Minerva's changes to the LTR LABS standard's secrets.toml (github.com/ltrlab/ltr-code, config/secrets.toml).
# This file is public: never list a real secret, or a home network's details, here.

[private-ips]
# Minerva's own networks, which its manuals document. Everything else private (a home LAN, a tailnet) stays flagged.
extend-allowed = [
    "10.42.0.0/24", # the Jetson's USB-C Ethernet, NetworkManager shared mode (docs/development/MINERVA_NETWORK.md)
    "10.42.1.0/24", # the access point `minerva` (ops/network.py AP_NETWORK)
    "192.168.50.0/24", # the AIZEE rover's earlier access point `aizee`
    "192.168.55.0/24", # L4T's USB device mode on a fresh Jetson (docs/quickstart/FRESH_JETSON_SETUP.md)
    "192.168.0.27/32", # AIZEE's documented default address, which its settings, scripts and the old collectors use
    "192.168.8.180/32", # The production unit's address in its per-unit profile, which SSH and its certificate use
]
