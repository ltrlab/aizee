# Minerva's changes to the LTR LABS standard's files.toml (github.com/ltrlab/ltr-code, config/files.toml).
# Exact-byte files (CAD exports, checksummed manifests, the qualified joint-limit reference) are marked -text in
# .gitattributes, which ltr-code honours; they need no entry here.

[exclude]
extend-paths = [
    "firmware/openrb_leader/openrb150_bsp/", # the vendored ROBOTIS Arduino core
    "docs/vendor/", # RobStride's manuals, which characterization/audit.py opens by name
    "docs/devices/MINERVA_GRIPPER_TRANSMISSION_20260924.json", # a measurement record, kept whole with its raw traces
    "src/robot_platform/viewer/static/vendor/", # vendored three.js, checksummed in sources.json
    "urdf/", # CAD exports
    "scripts/maintenance/gs_usb/*.patch", # kernel patches, whose whitespace is content
    "config/*_calibration.json", # written whole by the calibration tools
    "config/openrb_*.json", # the same
    "config/minerva_gravity.json", # the same
    "tests/fixtures/simulation/telemetry_v2.json", # a recorded fixture
]
