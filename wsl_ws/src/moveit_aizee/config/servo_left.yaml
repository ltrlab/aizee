###############################################
# MoveIt Servo parameters for Aizee dual arm
###############################################

use_gazebo: false            # real robot

# ───────────────── Incoming commands ──────────────────
command_in_type: "speed_units"  # joystick in [-1 … 1]

scale:
  linear:      0.01          # m/s  (was 0.4)
  rotational:  0.01          # rad/s (was 0.8)
  joint:       0.01          # unitless joint scale (was 0.5)

# ───────────────── Outgoing commands ──────────────────
publish_period: 0.02         # 50 Hz  (was 0.034 ≈ 29 Hz)
low_latency_mode: true       # send immediately after each stick sample

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions:   true     # positions cause a big first jump
publish_joint_velocities:  true      # smooth electrical load
publish_joint_accelerations: false

# smooth with a lightweight Butterworth
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# Servo runs its own PlanningScene — keep as-is
is_primary_planning_scene_monitor: true

# ───────────────── Robot / MoveIt frames ──────────────
move_group_name: left_arm
planning_frame:  gantry_base_link
ee_frame_name:   left_wrist_pitch_link
robot_link_command_frame: gantry_base_link

# ───────────────── Safety & timeouts ──────────────────
incoming_command_timeout: 0.05   # stop if no stick cmd for 50 ms
num_outgoing_halt_msgs_to_publish: 4

required_velocity_scaling: 0.0         # allow Servo to slow itself
position_only_ik:        true
# Singularities & joint limits
lower_singularity_threshold:  20.0 # Start decelerating when the condition number hits this (close to singularity)
hard_stop_singularity_threshold: 60.0 # Stop when the condition number hits this
joint_limit_margin: 0.1 # added as a buffer to joint limits [radians]. If moving quickly, make this larger.
leaving_singularity_threshold_multiplier: 1.0 # Multiply the hard stop limit by this when leaving singularity (see https://github.com/ros-planning/moveit2/pull/620)

publish_singularity_metric: true

# ───────────────── Topics ─────────────────────────────
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic:     ~/delta_joint_cmds
joint_topic:                /joint_states
status_topic:               ~/status
command_out_topic:          /left_arm_controller/joint_trajectory

# ───────────────── Collision checking ─────────────────
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold:   0.01
scene_collision_proximity_threshold:  0.02

