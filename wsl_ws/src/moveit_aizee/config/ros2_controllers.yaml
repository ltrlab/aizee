# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_upper_arm_joint
      - left_upper_elbow_joint
      - left_lower_elbow_joint
      - left_forearm_joint
      - left_wrist_pitch_joint
      - left_wrist_tool_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_upper_arm_joint
      - right_upper_elbow_joint
      - right_lower_elbow_joint
      - right_forearm_joint
      - right_wrist_pitch_joint
      - right_wrist_tool_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
