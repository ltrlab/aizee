[workspace]
members = [
    "rust/motor_control",
    "rust/comms",
    "rust/lidar_control",
    "rust/collision",
    "rust/control_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LTRLAB"]
license = "MIT"
repository = "https://github.com/ltrlab/aizee"

[workspace.dependencies]
# Shared protocol used by both robot backends.
comms = { path = "rust/comms" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Communication
zmq = "0.10"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse every float exactly. The default parser can be 1 ULP off, and the guarded
# receiver compares a collision envelope with the joint limits it read from JSON exactly.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rmp-serde = "1.1"

# CAN bus interface
socketcan = "3.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
serde_yaml = "0.9"

# Time
chrono = "0.4"

# Utilities
bytes = "1.5"
