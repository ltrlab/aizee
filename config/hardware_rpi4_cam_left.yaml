# AIZEE Hardware Configuration - RPi4 Camera Module (Left)
# RealSense D455 camera node for left-facing camera

camera:
  id: cam_left
  model: D455
  serial: D455_SERIAL_003  # Update after discovering actual serial

  streams:
    color:
      width: 640
      height: 480
      fps: 30
      format: RGB8
      compression: JPEG
      quality: 85

    depth:
      width: 640
      height: 480
      fps: 30
      format: Z16
      downsample_factor: 1

    imu:
      accel_rate: 200
      gyro_rate: 200

network:
  device:
    ip: 192.168.0.24
    hostname: AIZEE-ROVER-PI-3
    zmq:
      camera_pub: "tcp://*:5559"

spatial:
  position: [0.0, 0.20, 0.15]      # [x, y, z] in meters, relative to base_link
  orientation: [0.0, 0.0, 1.5708]  # [roll, pitch, yaw] in radians - facing left

logging:
  level: INFO
