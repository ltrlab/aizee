# AIZEE Hardware Configuration - Jetson Rover Module
# Rover base motors only (left_wheel, right_wheel, swivel)
# Arm motors controlled by separate RPi4 module

motors:
  # Drive wheels - ROBSTRIDE 04 Series
  wheels:
    - id: left_wheel
      can_id: 0x02
      type: ROBSTRIDE04
      max_velocity: 10.0  # rad/s
      max_torque: 12.0    # Nm

    - id: right_wheel
      can_id: 0x04
      type: ROBSTRIDE04
      max_velocity: 10.0
      max_torque: 12.0

  # Base swivel - ROBSTRIDE 03 Series
  swivel:
    id: swivel
    can_id: 0x03
    type: ROBSTRIDE03
    min_position: -15.0  # ±4π encoder range is ±12.566; ±15 gives headroom
    max_position: 15.0   # Teleop enforces relative travel via swivel_position
    max_velocity: 5.0
    max_torque: 6.0

  # Gantry arm - 6DoF
  # Wide limits to accommodate any startup encoder position ± π range
  # Teleop enforces ±π relative to home position
  arm:
    - id: gantry_base
      can_id: 0x05
      type: ROBSTRIDE04
      min_position: -20.0  # ~6 full rotations negative
      max_position: 20.0   # ~6 full rotations positive
      max_velocity: 10.0
      max_torque: 12.0

    - id: gantry_mid
      can_id: 0x06
      type: ROBSTRIDE03
      min_position: -20.0
      max_position: 20.0
      max_velocity: 5.0
      max_torque: 6.0

    - id: gantry_end
      can_id: 0x07
      type: ROBSTRIDE02
      min_position: -20.0
      max_position: 20.0
      max_velocity: 10.0
      max_torque: 4.0

    - id: wrist_pitch
      can_id: 0x08
      type: ROBSTRIDE02
      min_position: -20.0
      max_position: 20.0
      max_velocity: 10.0
      max_torque: 4.0

    - id: wrist_roll
      can_id: 0x09
      type: ROBSTRIDE00
      min_position: -20.0
      max_position: 20.0
      max_velocity: 30.0
      max_torque: 2.0

    - id: gripper
      can_id: 0x0A
      type: ROBSTRIDE00
      min_position: -20.0
      max_position: 20.0
      max_velocity: 30.0
      max_torque: 2.0

# Control loop parameters
control:
  arm_frequency: 1000.0  # Hz - not used but required by schema
  base_frequency: 100.0  # Hz - wheels + swivel
  telemetry_rate: 50.0   # Hz - published motor states
  watchdog_timeout: 0.1  # seconds - stop if no command received

# CAN bus configuration
can:
  interface: can1

# LiDAR sensors - RPLiDAR A1M8
lidars:
  - id: lidar_front
    device: /dev/rplidar_front  # Udev symlink (see config/udev/99-rplidar.rules)
    scan_mode: standard

  - id: lidar_back
    device: /dev/rplidar_back   # Udev symlink (see config/udev/99-rplidar.rules)
    scan_mode: standard

# UPS Power Module - Waveshare UPS Power Module (C)
ups:
  enabled: true
  i2c_bus: 7              # I2C bus number (Jetson Orin Nano default)
  i2c_addr: 0x41          # INA219 I2C address
  update_rate: 1.0        # Hz - publishing rate
  battery_chemistry: "lipo_3s"  # 3S LiPo (11.1V nominal)
  voltage_full: 12.6      # Fully charged (3 × 4.2V)
  voltage_nominal: 11.1   # Nominal (3 × 3.7V)
  voltage_warning: 10.5   # Warning threshold (3 × 3.5V)
  voltage_critical: 9.9   # Critical threshold (3 × 3.3V)
  voltage_min: 9.0        # Absolute minimum (3 × 3.0V)

# Network topology
network:
  device:  # Generic device config (was 'jetson')
    ip: 192.168.0.27
    hostname: aizee-jetson
    zmq:
      command_sub: "tcp://*:5555"      # Receives commands from teleop
      telemetry_pub: "tcp://*:5556"    # Publishes motor states
      lidar_pub: "tcp://*:5561"        # Publishes LiDAR scans
      ups_pub: "tcp://*:5562"          # Publishes UPS power telemetry
      arm_cam_left_pub: "tcp://*:5563" # D435 arm camera left  (see hardware_jetson_arm_cam_left.yaml)
      arm_cam_right_pub: "tcp://*:5564" # D435 arm camera right (see hardware_jetson_arm_cam_right.yaml)
