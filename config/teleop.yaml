# AIZEE Teleop Configuration
# Input mappings, scaling, and ZMQ endpoints

# Single-module configuration for dual-CAN Jetson
# All motors (rover + gantry) on one motor_control instance
endpoints:
  command: "tcp://192.168.0.27:5555"
  telemetry: "tcp://192.168.0.27:5556"
  ups_telemetry: "tcp://192.168.0.27:5562"  # UPS Power Module telemetry

# Multi-module configuration (distributed system)
# Comment out to use multi-module mode
# modules:
#   rover:
#     command: "tcp://192.168.0.27:5555"
#     telemetry: "tcp://192.168.0.27:5556"
#     motors: ["left_wheel", "right_wheel", "swivel"]
#   arm:
#     command: "tcp://192.168.0.28:5557"
#     telemetry: "tcp://192.168.0.28:5558"
#     motors: ["gantry_base", "gantry_mid", "gantry_end"]

motors:
  drive: ["left_wheel", "right_wheel"]
  # Swivel is joint 0 of the arm — there is no separate swivel group anymore.
  arm: ["swivel", "gantry_base", "gantry_mid", "gantry_end", "wrist_pitch", "wrist_roll", "gripper"]
  all: ["left_wheel", "right_wheel", "swivel", "gantry_base", "gantry_mid", "gantry_end", "wrist_pitch", "wrist_roll", "gripper"]

control:
  command_rate_hz: 50
  telemetry_timeout_ms: 200
  deadzone: 0.08

battery:
  # 6S LiPo battery monitoring (6 × 3.7V nominal = 22.2V)
  cells: 6
  cell_type: "lipo"
  voltage_full: 25.2      # 6 × 4.2V (fully charged)
  voltage_nominal: 22.2   # 6 × 3.7V (nominal)
  voltage_warning: 21.0   # 6 × 3.5V (warn)
  voltage_critical: 20.0  # 6 × 3.33V (shutdown threshold)
  voltage_min: 20.0       # 0% reference = shutdown threshold

ups:
  # Jetson UPS battery (3S LiPo: 9.0V min, 12.6V max)
  voltage_full: 12.6      # 3 × 4.2V (fully charged)
  voltage_nominal: 11.7   # 3 × 3.9V (nominal)
  voltage_warning: 10.8   # 3 × 3.6V (warn)
  voltage_shutdown: 10.0  # Jetson UPS auto-shutdown threshold

drive:
  max_linear: 2.0       # rad/s
  max_angular: 1.5      # rad/s
  linear_exponent: 1.5
  angular_exponent: 1.5
  # MIT-mode velocity control gains for drive wheels (no swivel here anymore;
  # swivel is part of `arm` and uses arm.kp[0] / arm.kd[0]).
  kp: 0.0               # Position gain (0 = pure velocity control)
  kd: 3.0               # Velocity tracking gain (damping)

arm:
  # 7-DOF gain vectors, swivel-first.
  # Order: [swivel, gantry_base, gantry_mid, gantry_end, wrist_pitch, wrist_roll, gripper]
  kp: [150.0, 200.0, 200.0, 50.0, 10.0, 3.0, 2.0]
  kd: [5.0,   7.0,   10.0,  4.0,  1.0,  1.0, 1.0]
  max_velocity: 1.0       # rad/s per joint
  increment: 0.02         # rad per key press (manual jog)
  swivel_increment: 0.01  # rad per Z/C key press (swivel-only jog kept for muscle memory)

gamepad:
  axes:
    left_stick_y: 1
    left_stick_x: 0
    right_stick_y: 3
    right_stick_x: 2
  buttons:
    a: 0          # enable all
    b: 1          # disable all
    back: 6       # emergency stop
    start: 7      # clear estop + faults
  axis_invert:
    left_stick_y: true
    left_stick_x: false
    right_stick_y: true
