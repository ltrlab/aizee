# AIZEE Teleop Configuration
# Input mappings, scaling, and ZMQ endpoints

# Multi-module configuration (rover + arm)
# Comment out 'modules' section to use legacy 'endpoints' mode
modules:
  rover:
    command: "tcp://192.168.0.27:5555"
    telemetry: "tcp://192.168.0.27:5556"
    motors: ["left_wheel", "right_wheel", "swivel"]
  arm:
    command: "tcp://192.168.0.28:5557"
    telemetry: "tcp://192.168.0.28:5558"
    motors: ["shoulder_pitch", "elbow", "wrist"]

# Legacy single-module configuration (backward compatible)
# Uncomment to use single-module mode
# endpoints:
#   command: "tcp://192.168.0.27:5555"
#   telemetry: "tcp://192.168.0.27:5556"
#   ups_telemetry: "tcp://192.168.0.27:5562"  # UPS Power Module telemetry

motors:
  drive: ["left_wheel", "right_wheel"]
  swivel: ["swivel"]
  arm: ["shoulder_pitch", "elbow", "wrist"]
  all: ["left_wheel", "right_wheel", "swivel", "shoulder_pitch", "elbow", "wrist"]

control:
  command_rate_hz: 20
  telemetry_timeout_ms: 200
  deadzone: 0.08

battery:
  # 6S LiPo battery monitoring (6 × 3.7V nominal = 22.2V)
  cells: 6
  cell_type: "lipo"
  voltage_full: 25.2      # 6 × 4.2V (fully charged)
  voltage_nominal: 22.2   # 6 × 3.7V (nominal)
  voltage_warning: 21.0   # 6 × 3.5V (land soon)
  voltage_critical: 20.0  # 6 × 3.33V (land immediately)
  voltage_min: 18.0       # 6 × 3.0V (damage threshold - emergency only)

drive:
  max_linear: 2.0       # rad/s
  max_angular: 1.5      # rad/s
  max_swivel: 1.0       # rad/s
  linear_exponent: 1.5
  angular_exponent: 1.5

arm:
  max_velocity: 1.0
  kp: [3.0, 3.0, 3.0]
  kd: [0.3, 0.3, 0.3]

gamepad:
  axes:
    left_stick_y: 1
    left_stick_x: 0
    right_stick_y: 3
    right_stick_x: 2
  buttons:
    a: 0          # enable all
    b: 1          # disable all
    back: 6       # emergency stop
    start: 7      # clear estop + faults
  axis_invert:
    left_stick_y: true
    left_stick_x: false
