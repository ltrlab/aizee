# Minerva RIGHT-WRIST camera — USB UVC color, published for the collector's
# right_wrist stream (tcp://<jetson>:5565). Run with gripper_camera_node.py.
#
# NOTE: `device` is a raw /dev/videoN for bring-up (NOT stable across replug/
# reboot). Once both wrist cams are healthy, pin stable names with a udev rule
# and point `device` at the symlink.
camera:
  id: right_wrist
  device: /dev/video0            # HD USB Camera (32e4:9230) — the physical RIGHT wrist cam
  usb_id: "32e4:9230"            # USB VID:PID — resolves the physical RIGHT-arm camera regardless
                                 # of /dev/videoN (renumbers on replug). NOTE: 05a3/32e4 swapped
                                 # from bring-up — 32e4 is the right arm, 05a3 the left.
  fourcc: MJPG
  streams:
    color:
      enabled: true
      width: 640                 # matches minerva.yaml cameras.right_wrist
      height: 480
      fps: 30
      compression: JPEG
      quality: 85
      flip: "none"
  v4l2_controls: {}              # v4l-utils not installed; use camera defaults for now

network:
  device:
    ip: 10.42.0.1
    hostname: aizee-rover
    zmq:
      camera_pub:  "tcp://*:5565"   # Minerva right_wrist stream
      camera_ctrl: "tcp://*:5574"   # runtime V4L2 control REP (free port; 5573=left_wrist)

logging:
  level: INFO
