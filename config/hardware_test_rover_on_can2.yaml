# Test config - Rover motors on can2
# This tests if can2 adapter can control the known-good rover motors

motors:
  wheels:
    - id: left_wheel
      can_id: 0x02  # Rover left wheel (RB04)
      type: ROBSTRIDE04
      max_velocity: 10.0
      max_torque: 12.0

    - id: right_wheel
      can_id: 0x04  # Rover right wheel (RB04)
      type: ROBSTRIDE04
      max_velocity: 10.0
      max_torque: 12.0

  swivel:
    id: swivel
    can_id: 0x03  # Rover swivel (RB03)
    type: ROBSTRIDE03
    min_position: -3.14159
    max_position: 3.14159
    max_velocity: 5.0
    max_torque: 6.0

  arm: []

control:
  arm_frequency: 1000.0
  base_frequency: 100.0
  telemetry_rate: 50.0
  watchdog_timeout: 0.1

can:
  interface: can2

network:
  device:
    ip: 192.168.0.27
    hostname: aizee-jetson
    zmq:
      command_sub: "tcp://*:5555"
      telemetry_pub: "tcp://*:5556"
