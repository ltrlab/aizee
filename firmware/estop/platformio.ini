[platformio]
default_envs = station, receiver

; ── Station: AtomS3R (ESP32-S3) + TailBat ────────────────────────────────────
; E-stop button on Grove PORT.A: NC=G2, NO=G1
[env:station]
platform = espressif32
board = m5stack-atoms3
framework = arduino
build_src_filter = +<station/*>
lib_deps =
    m5stack/M5Unified
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Receiver: ESP-WROOM-32 on Jetson ─────────────────────────────────────────
; Connected via USB for power + serial.
[env:receiver]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<receiver/*>
monitor_speed = 115200
