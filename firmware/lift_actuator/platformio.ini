[platformio]
default_envs = lift

; ── Vertical Gantry Actuator (Minerva `lift`) ────────────────────────────────
; Elegoo Uno R3 + Inland/Seeed-style MCP2515 CAN shield (16 MHz crystal) +
; AS5600 magnetic encoder (I2C) + DROK L298 H-bridge on a 12 VDC desk-leg column.
; Emulates a ROBSTRIDE motor on the AIZEE CAN chain — see include/protocol.h.
[env:lift]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can
    robtillaart/AS5600
