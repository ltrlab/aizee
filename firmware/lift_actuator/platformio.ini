; Minerva's lift: a 12 V desk-leg column on an Arduino Uno, a DROK H-bridge, an INA219 and an AS5600.
; The Uno talks to its receiver over USB serial. README.md has the wiring, the bring-up and the protocol.
;
;   pio run -e lift_bench -t upload     the bring-up console (open-loop jogs, homing, single moves)
;   pio run -e lift -t upload           what the receiver talks to
;   pio test -e sim                     the tests, on a simulated ATmega328P
[platformio]
default_envs = lift

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 1000000
build_flags = -Wall -Wextra

[env:lift]

[env:lift_bench]
build_flags = ${env.build_flags} -DLIFT_BENCH
monitor_echo = yes

; The tests run on the same instruction set as the board, so a sum that overflows the Uno's 16-bit int fails here too.
[env:sim]
build_flags = ${env.build_flags} -DLIFT_BENCH
platform_packages = platformio/tool-simavr
; Nothing to flash: without this, `pio test` looks for a real board on the first serial port it finds.
upload_protocol = custom
upload_command = $PYTHONEXE -c "pass"
test_framework = unity
test_speed = 9600
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega328p
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
