; OpenRB-150 leader-arm bridge.
;
; Reads 7x Dynamixel XL330-M077-T servos on the built-in TTL bus and streams
; their positions to the host (Jetson/PC) over USB-CDC using a small binary
; protocol.  The host side lives in python/teleop/openrb_leader.py.
;
; Standard PlatformIO layout: source in src/, board overlay in boards/,
; vendored OpenRB BSP in openrb150_bsp/.
;   pio run -e openrb150 -t upload --upload-port COM4
[platformio]
default_envs = openrb150

[env:openrb150]
platform   = atmelsam
board      = openrb150
framework  = arduino
monitor_speed = 1000000
; Override the SAMD core with the Robotis OpenRB-150 BSP installed via the
; Arduino IDE.  This gives us the OpenRB variant files (Serial1 mapping,
; USB descriptor, bootloader linker script) without re-vendoring them.
platform_packages =
    framework-arduino-samd@symlink://./openrb150_bsp
lib_deps =
    robotis-git/Dynamixel2Arduino@^0.8.1
build_flags =
    -DDXL_BAUD=1000000
    -DDXL_NUM_SERVOS=7
