[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltrlab-robot-platform"
version = "0.1.0"
description = "Shared control, data, and application platform for Aizee and Minerva"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LTRLAB"}]
dependencies = ["msgpack>=1.0.5"]

[project.optional-dependencies]
control = ["numpy>=1.24", "pyzmq>=25"]
calibration = ["paramiko>=3.4", "aiohttp>=3.9", "numpy>=1.24", "trimesh==4.12.2"]
data = ["numpy>=1.24", "h5py>=3.9"]
capture = ["numpy>=1.24", "pyzmq>=25", "h5py>=3.9", "Pillow>=10"]
helm = ["numpy>=1.24", "scipy>=1.10", "pyzmq>=25", "h5py>=3.9", "Pillow>=10", "aiohttp>=3.9", "paramiko>=3.4", "pyserial>=3.5", "trimesh==4.12.2", "python-fcl==0.7.0.11"]
operator = ["numpy>=1.24", "pyzmq>=25", "h5py>=3.9", "PyYAML>=6", "Pillow>=10", "pyserial>=3.5", "PySide6>=6.5", "pygame>=2.5", "rerun-sdk>=0.15", "opencv-python>=4.8"]
learning = ["numpy>=1.24", "h5py>=3.9", "torch>=2.1", "torchvision>=0.16", "einops>=0.6", "tensorboard>=2.14", "PyYAML>=6", "Pillow>=10"]
language = ["sentence-transformers>=2.2"]
webxr = ["aiohttp>=3.9", "cryptography>=41", "aiortc>=1.14", "av>=11"]
preview = ["fast-simplification>=0.1.7", "scikit-image>=0.22"]
viewer = ["aiohttp>=3.9", "numpy>=1.24", "trimesh==4.12.2"]
leaders = ["aiohttp>=3.9", "pyserial>=3.5"]
dev = ["pytest>=7.4", "hypothesis>=6.100", "setuptools>=68", "wheel"]
simulation = ["numpy>=1.24", "pyzmq>=25", "h5py>=3.9", "Pillow>=10", "PyYAML>=6"]
physics = ["mujoco>=3.15,<4", "numpy>=1.24"]
cad = ["onshape-to-robot==1.8.2"]
collision = ["numpy>=1.24", "scipy>=1.10", "trimesh==4.12.2", "python-fcl==0.7.0.11"]

[project.scripts]
robot-platform = "robot_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_platform*"]

[tool.setuptools.package-data]
"robot_platform.robots" = ["definitions/*.json"]
"robot_platform.settings" = ["defaults/*.json"]
"robot_platform.viewer" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
"robot_platform.helm" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "--import-mode=importlib"
markers = ["hardware: requires explicit physical robot access", "integration: offline process or application integration"]
