name: Offline control gate
on:
  pull_request:
  push:
    branches: [overhaul, 'codex/overhaul-integration']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Select baseline Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - run: python scripts/dev.py setup
      - run: python scripts/dev.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-control-${{ matrix.os }}
          path: build/dev-check/
